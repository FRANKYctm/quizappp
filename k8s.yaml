apiVersion: apps/v1
kind: Deployment
metadata:
  name: quizapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: quizapp
  template:
    metadata:
      labels:
        app: quizapp
    spec:
      containers:
        - name: quizapp
          image: quizapp:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: quizapp-service
spec:
  type: NodePort
  selector:
    app: quizapp
  ports:
    - port: 80
      targetPort: 5000
